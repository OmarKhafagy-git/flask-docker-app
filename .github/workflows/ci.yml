name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest



  # Build the image and push it to Docker Hub
  build-and-push:
    needs: test                           # only runs if tests pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'   # never push from pull requests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}
    
    
  # Deploy the new image to the EC2 server through SSM (no SSH, no keys)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # allows the job to request an OIDC token from GitHub
      contents: read
    steps:
      - name: Debug - show what GitHub sends to AWS
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print('sub =', d['sub']); print('aud =', d['aud'])" "$TOKEN"
      
      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Find the server by its tag
        id: server
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=flask-app-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$INSTANCE_ID" = "None" ]; then
            echo "No running server found. Did you run terraform apply?"
            exit 1
          fi
          echo "Found server: $INSTANCE_ID"
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Pull the new image and restart the app
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}
          INSTANCE_ID: ${{ steps.server.outputs.id }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"docker pull $IMAGE\",\"docker rm -f flask-app || true\",\"docker run -d --restart unless-stopped -p 80:5000 --name flask-app $IMAGE\",\"docker image prune -f\",\"sleep 5\",\"curl -fsS http://localhost/health\"]" \
            --query "Command.CommandId" --output text)
          echo "Sent command: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

