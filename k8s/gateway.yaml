apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flask-gateway
  namespace: flask-app
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flask-route
  namespace: flask-app
spec:
  parentRefs:
    - name: flask-gateway
  hostnames:
    - flask.local
  rules:
    - backendRefs:
        - name: flask-app
          port: 80