apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flask-app-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: flask-app
      rules:
        - alert: FlaskAppHighCPU
          expr: |
            sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="flask-app", pod=~"flask-app-.*", container!=""}[5m]))
            /
            sum by (pod) (kube_pod_container_resource_requests{namespace="flask-app", resource="cpu"})
            > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is using over 80% of its CPU request"

        - alert: FlaskAppPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="flask-app"}[10m]) > 2
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} restarted more than 2 times in 10 minutes"
